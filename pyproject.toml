[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "customer-ops"
version = "0.2.0"
description = "Minimal autonomous customer support experiment"
requires-python = ">=3.12"
dependencies = [
    "sentence-transformers>=3,<6",
    "transformers>=4.56,<6",
    "torch>=2.4,<3",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_ops"]
